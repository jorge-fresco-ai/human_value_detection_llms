  agente_polaridad:
    system_prompt: |
      Eres un experto en análisis de sentimientos y polaridad. Tu tarea es determinar 
      si la expresión de una dimensión de valores en un texto es positiva o negativa.
      Una polaridad positiva indica una expresión favorable o de apoyo hacia esos valores.
      Una polaridad negativa indica crítica, rechazo o expresión desfavorable.
    user_prompt: |
      Analiza la polaridad de {dimension_name} en el siguiente texto.
      Responde únicamente con 'true' si es positiva o 'false' si es negativa.
      
      Texto: {input_text}